[preset.1.options]

variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2
html/head_include="<style>
/* Loading screen in the landing page look (docs/assets/site.css tokens): graphite, cream, coral, Anuphan. */
@font-face { font-family: \"Anuphan\"; src: url(\"../assets/fonts/anuphan.woff2\") format(\"woff2\"); font-weight: 100 700; font-display: swap; }
body { background: #1f2433; }
#status { background: #1f2433 url(\"../assets/img/hero-back.webp\") center / cover no-repeat; color: #f4ede1;
  font-family: \"Anuphan\", system-ui, sans-serif; }
#status::before { content: \"\"; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 55%, rgb(31 36 51 / 0.55), rgb(31 36 51 / 0.92) 70%); }
#status-splash { display: none; }
#load-card { position: relative; display: grid; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
#load-card img { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 10px 24px -12px rgb(8 10 18 / 0.8); }
#load-card h1 { margin: 0; font-size: clamp(1.8rem, 1.2rem + 3vw, 3.2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
#load-card h1 small { display: block; margin-top: 6px; font-size: 0.42em; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #f2643d; }
#load-card p { margin: 0; font-size: 15px; color: #c9c2b5; }
#status-progress { position: relative; bottom: auto; width: min(320px, 70vw); height: 6px; margin: 8px 0 0;
  -webkit-appearance: none; appearance: none; border: 0; border-radius: 999px; overflow: hidden; background: rgb(244 237 225 / 0.16); }
#status-progress::-webkit-progress-bar { background: transparent; }
#status-progress::-webkit-progress-value { background: #f2643d; border-radius: 999px; transition: width 0.2s; }
#status-progress::-moz-progress-bar { background: #f2643d; border-radius: 999px; }
#status-progress:indeterminate { background: linear-gradient(90deg, transparent, #f2643d, transparent) 0 0 / 40% 100% no-repeat rgb(244 237 225 / 0.16);
  animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }
#status-notice { position: relative; margin: 8px 24px 0; padding: 12px 16px; border-radius: 14px; border: 1px solid #f2643d;
  background: #272d3e; color: #f4ede1; font-family: inherit; }
@media (prefers-reduced-motion: reduce) { #status-progress:indeterminate { animation: none; background-position: 50% 0; } }

#rotate { display: none; position: fixed; inset: 0; z-index: 100; place-content: center; gap: 18px; padding: 24px;
  background: #1f2433; color: #f4ede1; font: 600 20px/1.4 \"Anuphan\", system-ui, sans-serif; text-align: center; }
#rotate svg { width: 72px; height: 72px; margin: 0 auto; color: #f2643d; animation: tilt 2.4s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }
html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
</style>
<script>
// Phones and tablets play sideways: a portrait screen shows a turn-your-device card over the game.
// Android Chrome can also go fullscreen and lock landscape on the first tap (iOS cannot, the card stays).
addEventListener(\"DOMContentLoaded\", function () {
  // Loading card: title above Godot's own progress bar / error notice (both stay in #status, the shell drives them).
  var s = document.getElementById(\"status\");
  if (s) {
    var c = document.createElement(\"div\");
    c.id = \"load-card\";
    c.innerHTML = '<img src=\"../assets/img/icon-180.png\" alt=\"\"><h1>The Last Wild Paw<small>Survival Journey</small></h1><p><span lang=\"th\">กำลังโหลดเกม…</span> · Loading…</p>';
    c.appendChild(document.getElementById(\"status-progress\"));
    c.appendChild(document.getElementById(\"status-notice\"));
    s.appendChild(c);
  }
  var d = document.createElement(\"div\");
  d.id = \"rotate\";
  d.innerHTML = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><rect x=\"7\" y=\"2\" width=\"10\" height=\"20\" rx=\"2\"/><path d=\"M11 18h2\"/></svg><div>Turn your device sideways to play<br><span lang=\"th\">หมุนจอเป็นแนวนอนเพื่อเล่น</span></div>';
  document.body.appendChild(d);
  addEventListener(\"touchend\", function lock() {
    removeEventListener(\"touchend\", lock);
    var el = document.documentElement;
    if (el.requestFullscreen && screen.orientation && screen.orientation.lock) {
      el.requestFullscreen().then(function () { return screen.orientation.lock(\"landscape\"); }).catch(function () {});
    }
  });
});
</script>"
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

