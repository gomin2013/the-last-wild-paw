[preset.1.options]

variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2
html/head_include="<style>
#rotate { display: none; position: fixed; inset: 0; z-index: 100; place-content: center; gap: 18px; padding: 24px;
  background: #1f2433; color: #f4ede1; font: 600 20px/1.4 system-ui, sans-serif; text-align: center; }
#rotate svg { width: 72px; height: 72px; margin: 0 auto; animation: tilt 2.4s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }
html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
</style>
<script>
// Phones and tablets play sideways: a portrait screen shows a turn-your-device card over the game.
// Android Chrome can also go fullscreen and lock landscape on the first tap (iOS cannot, the card stays).
addEventListener(\"DOMContentLoaded\", function () {
  var d = document.createElement(\"div\");
  d.id = \"rotate\";
  d.innerHTML = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><rect x=\"7\" y=\"2\" width=\"10\" height=\"20\" rx=\"2\"/><path d=\"M11 18h2\"/></svg><div>Turn your device sideways to play<br><span lang=\"th\">หมุนจอเป็นแนวนอนเพื่อเล่น</span></div>';
  document.body.appendChild(d);
  addEventListener(\"touchend\", function lock() {
    removeEventListener(\"touchend\", lock);
    var el = document.documentElement;
    if (el.requestFullscreen && screen.orientation && screen.orientation.lock) {
      el.requestFullscreen().then(function () { return screen.orientation.lock(\"landscape\"); }).catch(function () {});
    }
  });
});
</script>"
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

