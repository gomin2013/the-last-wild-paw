name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GODOT_VERSION: 4.7.2

jobs:
  gdscript:
    name: GDScript (format, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ponytail: skips until the Godot project exists (Phase 1), so Phase 0 pushes stay green
      - id: has
        run: echo "godot=$([ -n "$(git ls-files 'project.godot' '**/project.godot')" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.godot == 'yes'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: steps.has.outputs.godot == 'yes'
        run: pip install "gdtoolkit==4.*"
      # own scripts only: vendored addons (GUT) would fail both tools
      - if: steps.has.outputs.godot == 'yes'
        run: |
          git ls-files -z '*.gd' ':!:addons/**' | xargs -0 -r gdformat --check
          git ls-files -z '*.gd' ':!:addons/**' | xargs -0 -r gdlint

  godot:
    name: Godot (import, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: has
        run: |
          p=$(git ls-files 'project.godot' '**/project.godot' | head -1)
          echo "dir=$([ -n "$p" ] && dirname "$p")" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.dir != ''
        name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - if: steps.has.outputs.dir != ''
        name: Import project (fails on script/resource errors)
        working-directory: ${{ steps.has.outputs.dir }}
        # ponytail: warm-up import first; project settings (gui/theme/custom_font) load before a fresh
        # checkout has imported them, so only the second run's errors are real
        run: |
          godot --headless --import > /dev/null 2>&1 || true
          godot --headless --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed" import.log
      - if: steps.has.outputs.dir != '' && hashFiles('**/addons/gut/gut_cmdln.gd') != ''
        name: GUT tests
        working-directory: ${{ steps.has.outputs.dir }}
        # GUT exits 0 with zero tests when class_names aren't imported: require the summary line
        run: |
          set -o pipefail
          godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit 2>&1 | tee gut.log
          grep -qE "^Tests +[1-9]" gut.log
