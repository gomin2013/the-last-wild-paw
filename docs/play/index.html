<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>The Last Wild Paw: Survival Journey</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1f2433;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>
/* Loading screen in the landing page look (docs/assets/site.css tokens): graphite, cream, coral, Anuphan. */
@font-face { font-family: "Anuphan"; src: url("../assets/fonts/anuphan.woff2") format("woff2"); font-weight: 100 700; font-display: swap; }
body { background: #1f2433; }
#status { background: #1f2433 url("../assets/img/hero-back.webp") center / cover no-repeat; color: #f4ede1;
  font-family: "Anuphan", system-ui, sans-serif; }
#status::before { content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 55%, rgb(31 36 51 / 0.55), rgb(31 36 51 / 0.92) 70%); }
#status-splash { display: none; }
#load-card { position: relative; display: grid; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
#load-card img { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 10px 24px -12px rgb(8 10 18 / 0.8); }
#load-card h1 { margin: 0; font-size: clamp(1.8rem, 1.2rem + 3vw, 3.2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
#load-card h1 small { display: block; margin-top: 6px; font-size: 0.42em; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #f2643d; }
#load-card p { margin: 0; font-size: 15px; color: #c9c2b5; }
#status-progress { position: relative; bottom: auto; width: min(320px, 70vw); height: 6px; margin: 8px 0 0;
  -webkit-appearance: none; appearance: none; border: 0; border-radius: 999px; overflow: hidden; background: rgb(244 237 225 / 0.16); }
#status-progress::-webkit-progress-bar { background: transparent; }
#status-progress::-webkit-progress-value { background: #f2643d; border-radius: 999px; transition: width 0.2s; }
#status-progress::-moz-progress-bar { background: #f2643d; border-radius: 999px; }
#status-progress:indeterminate { background: linear-gradient(90deg, transparent, #f2643d, transparent) 0 0 / 40% 100% no-repeat rgb(244 237 225 / 0.16);
  animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }
#status-notice { position: relative; margin: 8px 24px 0; padding: 12px 16px; border-radius: 14px; border: 1px solid #f2643d;
  background: #272d3e; color: #f4ede1; font-family: inherit; }
@media (prefers-reduced-motion: reduce) { #status-progress:indeterminate { animation: none; background-position: 50% 0; } }

#rotate { display: none; position: fixed; inset: 0; z-index: 100; place-content: center; gap: 18px; padding: 24px;
  background: #1f2433; color: #f4ede1; font: 600 20px/1.4 "Anuphan", system-ui, sans-serif; text-align: center; }
#rotate svg { width: 72px; height: 72px; margin: 0 auto; color: #f2643d; animation: tilt 2.4s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }
html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
</style>
<script>
// Phones and tablets play sideways: a portrait screen shows a turn-your-device card over the game.
// Android Chrome can also go fullscreen and lock landscape on the first tap (iOS cannot, the card stays).
addEventListener("DOMContentLoaded", function () {
  // Loading card: title above Godot's own progress bar / error notice (both stay in #status, the shell drives them).
  var s = document.getElementById("status");
  if (s) {
    var c = document.createElement("div");
    c.id = "load-card";
    c.innerHTML = '<img src="../assets/img/icon-180.png" alt=""><h1>The Last Wild Paw<small>Survival Journey</small></h1><p><span lang="th">กำลังโหลดเกม…</span> · Loading…</p>';
    c.appendChild(document.getElementById("status-progress"));
    c.appendChild(document.getElementById("status-notice"));
    s.appendChild(c);
  }
  var d = document.createElement("div");
  d.id = "rotate";
  d.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><div>Turn your device sideways to play<br><span lang="th">หมุนจอเป็นแนวนอนเพื่อเล่น</span></div>';
  document.body.appendChild(d);
  addEventListener("touchend", function lock() {
    removeEventListener("touchend", lock);
    var el = document.documentElement;
    if (el.requestFullscreen && screen.orientation && screen.orientation.lock) {
      el.requestFullscreen().then(function () { return screen.orientation.lock("landscape"); }).catch(function () {});
    }
  });
});
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5576584,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
